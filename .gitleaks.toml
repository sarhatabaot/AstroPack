# Gitleaks configuration for AstroPack.
#
# Used by .github/workflows/gitleaks.yml and by any local run:
#   gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact
#
# Allowlisting policy: an entry here asserts "this is not a secret", or "this
# was a secret, it has been rotated, and the historical hit is now noise".
# Never allowlist a live credential to quiet the scan -- rotate it first. The
# history job does not gate the build precisely so that nobody is tempted to.

title = "AstroPack secret scan"

[extend]
useDefault = true

# --- global allowlists ------------------------------------------------------

[[allowlists]]
description = """
Third-party code vendored under matlab/external/ and matlab/obsolete/. Both are
read-only by repository convention (see CLAUDE.md), so a finding there is not
actionable by this project, and the sample keys inside test suites of vendored
libraries are a steady source of noise.
"""
paths = [
    '''^matlab/external/''',
    '''^matlab/obsolete/''',
]

[[allowlists]]
description = """
Binary and image fixtures. High-entropy by nature, so generic entropy rules fire
on them constantly, and a real credential would not be stored this way.
"""
paths = [
    '''\.(fits?|fit|hdf5|h5|mat|png|jpe?g|gif|pdf|7z|zip|tar\.gz|mexa64|mexw64)$''',
]

[[allowlists]]
description = """
Lazarus form resources (.lfm). These embed toolbar and icon bitmaps as base64,
which the square-access-token rule matches on shape alone. Measured: 25 of the
53 history findings came from .lfm files and every one was image data, so
leaving them in drowns the real hits.
"""
paths = [
    '''\.lfm(\.bak)?$''',
]

[[allowlists]]
description = """
python/src/util/ddns/pydynu/api.key -- verified empty (0 bytes) at the commit
that added it, b5ce2a7c4. The filename matches the generic key-file rule but
there has never been any content. Deleted from HEAD; retained here so the
history scan stays quiet about a known non-issue.
"""
paths = [
    '''^python/src/util/ddns/pydynu/api\.key$''',
]

# --- triaged 2026-08-10, confirmed not secrets ------------------------------
#
# Each entry below is scoped to a rule as well as a path, so these files stay
# under scrutiny for every OTHER rule. A future real credential in them still
# fires; only the specific known-benign pattern is silenced.

[[allowlists]]
description = """
AstroWCS keyword strings. wcs2keyCell builds FITS WCS header cards, and the
generic-api-key rule matches their shape. Reviewed and confirmed not a
credential. Covers the current class, the pre-package copy, and the generated
markdown docs.
"""
targetRules = ["generic-api-key"]
paths = [
    '''AstroWCS\.m$''',
    '''AstroWCS\.md$''',
]

[[allowlists]]
description = """
@WebServer usage comment: a `curl "http://localhost:8080/echo?..."` example.
The curl-auth-user rule fires on the URL shape. Reviewed and confirmed not a
credential.
"""
targetRules = ["curl-auth-user"]
paths = [
    '''matlab/util/\+tools/@WebServer/WebServer\.m$''',
]

[[allowlists]]
description = """
ULTRASAT SOC api-key values in API documentation and debug scripts.

Triaged 2026-08-10 by the repository owner and marked not an issue. Recorded
here rather than left firing so the scan stays actionable -- but note the
value is a live-looking SOC_API_KEY and appears in three places, so if that
determination ever changes, these are the paths to revisit.
"""
targetRules = ["generic-api-key", "curl-auth-header"]
paths = [
    '''matlab/astro/\+ultrasat/\+api/docs/.*\.md$''',
    '''matlab/astro/\+ultrasat/.*\.prompt\.md$''',
    '''\+debug/.*debug_VirtualTime\.m$''',
    '''\+ultrasat/\+api/\+debug/.*\.m$''',
    '''matlab/soc/\+soc/\+api/debug.*\.m$''',
]

[[allowlists]]
description = """
NativeXml.pas (vendored, both the delphi/ and lazarus/ copies). The hits are
Pascal variable declarations in its AES helper -- `AESKey128: TAESKey128;` --
which the generic-api-key rule reads as a `key:` assignment. Third-party code,
no credential.
"""
targetRules = ["generic-api-key"]
paths = [
    '''NativeXml\.pas$''',
]

# --- rotation ledger --------------------------------------------------------
#
# This project does NOT scrub history. Once a secret has been pushed to a
# public repository it is public, and rewriting 80 refs does not un-publish it:
# forks, clones and caches keep their copies. Rotation is the remedy; the
# history entry then becomes a harmless record of a credential that no longer
# works.
#
# So the workflow is: rotate the credential, confirm the old one is dead, then
# retire its finding here with the date and who did it. Until an entry appears,
# the weekly scan keeps reporting -- which is the point.
#
# Template:
#
#   [[allowlists]]
#   description = """
#   <what it was> -- rotated <YYYY-MM-DD> by <who>. Old value revoked and
#   confirmed dead on <how it was verified>. History hit retained below only to
#   silence the scan.
#   """
#   commits = ["30dbc93630c6..."]
#
# Outstanding, deliberately NOT allowlisted until rotation is confirmed:
#
#   aws/admin/KeyPair1.pem       commit 30dbc9363, 2021-05-09
#                                Real 1674-byte RSA private key. Deleted from
#                                HEAD in 7c2d02659, still reachable from ~80
#                                refs on both the public upstream and this
#                                fork. Revoke the EC2 key pair in AWS and check
#                                CloudTrail for use.
#
#   TNS bot API key              live in HEAD: +VO/+TNS/downloadAll.m,
#                                queryTNS.m, searchCooWWW.m. Bot LAST_Bot1,
#                                TNS_ID 159514. Regenerate on the TNS site and
#                                move it to an environment variable.
#
#   Dynu DDNS API key            web/ddns/ddns.md, commit b5ce2a7c45de.
#                                Regenerate at dynu.com/ControlPanel/APICredentials.
#
#   FMSoft support password      delphi/packages/unigui/unigui-license/,
#                                commit 56137e969cc9. A personal account
#                                password, not a service credential -- change
#                                it on the vendor's site.
#
#   DB passwords in HEAD         matlab/python/test1/clickhouse_test.m,
#                                clickhouse_test1.m,
#                                matlab/testing/test_db/postgres1.m,
#                                matlab/util/+db/draft/Database.m. Below the
#                                default rules' threshold, so gitleaks does not
#                                flag them, but they are hardcoded all the same.
